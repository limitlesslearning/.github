name: Bug report
description: Report a defect in docs, tooling, or product behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - docs
        - platform
        - .github
        - Unsure / cross-cutting
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or environment
      description: Page URL, commit SHA, or local command if applicable.
      placeholder: https://limitlesslearning.github.io/docs/...
  - type: dropdown
    id: severity
    attributes:
      label: Suggested priority
      options:
        - p0-critical
        - p1-high
        - p2-medium
        - p3-low
        - Unsure
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Logs / screenshots
      description: Paste errors or attach screenshots if useful.
