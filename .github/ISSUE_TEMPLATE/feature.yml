name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["feature", "needs-triage"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - docs
        - platform
        - .github
        - Unsure / cross-cutting
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docs
        - Graph
        - Content
        - Learning Experience
        - Assessment
        - Credentials
        - Integrity
        - Infrastructure
        - Community
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for learners, contributors, or partners?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should we build or change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the project board for duplicates
          required: true
        - label: This does not conflict with a locked Decision log entry (or I explain new evidence)
          required: true
