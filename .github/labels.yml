# Label taxonomy for limitlesslearning (.github, docs, platform)
# Synced by .github/workflows/sync-labels.yml via crazy-max/ghaction-github-labeler

# --- Type ---
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "feature"
  color: "a2eeef"
  description: "New capability or enhancement"
- name: "docs"
  color: "0075ca"
  description: "Documentation site or contributor docs"
- name: "content"
  color: "1d76db"
  description: "Klados Handbook or educational content"
- name: "rfc"
  color: "5319e7"
  description: "Decision / RFC proposal"
- name: "chore"
  color: "fef2c0"
  description: "Maintenance, tooling, or repo hygiene"
- name: "refactor"
  color: "c5def5"
  description: "Code change that neither fixes a bug nor adds a feature"
- name: "test"
  color: "0e8a16"
  description: "Tests or test infrastructure"
- name: "security"
  color: "b60205"
  description: "Security vulnerability or hardening"

# --- Priority ---
- name: "p0-critical"
  color: "b60205"
  description: "P0 — outage, security, data loss; respond in 1–2 business days"
- name: "p1-high"
  color: "d93f0b"
  description: "P1 — major bug/gap; respond within ~1 week"
- name: "p2-medium"
  color: "fbca04"
  description: "P2 — normal priority; best effort in current phase"
- name: "p3-low"
  color: "0e8a16"
  description: "P3 — nice-to-have; backlog, no committed SLA"

# --- Area ---
- name: "area:docs"
  color: "0075ca"
  description: "Documentation site / Klados Handbook publishing"
- name: "area:graph"
  color: "0052cc"
  description: "Knowledge graph model and prerequisites"
- name: "area:content"
  color: "1d76db"
  description: "Content discovery, licensing, and linking"
- name: "area:learning-experience"
  color: "5319e7"
  description: "Learner UX, paths, and progression UI"
- name: "area:assessment"
  color: "d4c5f9"
  description: "Mastery assessment and scoring"
- name: "area:credentials"
  color: "bfdadc"
  description: "Verifiable credentials and job profiles"
- name: "area:integrity"
  color: "d93f0b"
  description: "Verification, anti-fraud, and trust"
- name: "area:infrastructure"
  color: "e4e669"
  description: "CI, hosting, backends, and platform ops"
- name: "area:community"
  color: "d876e3"
  description: "Community, governance, and contributor experience"

# --- Phase ---
- name: "phase:0-docs"
  color: "cfd3d7"
  description: "Phase 0 — Documentation"
- name: "phase:1-mvp"
  color: "c2e0c6"
  description: "Phase 1 — MVP"
- name: "phase:2-expansion"
  color: "bfdadc"
  description: "Phase 2 — Expansion"
- name: "phase:3-economy-governance"
  color: "f9d0c4"
  description: "Phase 3 — Economy & governance"
- name: "phase:4-global"
  color: "fef2c0"
  description: "Phase 4 — Global scale"

# --- Status ---
- name: "needs-triage"
  color: "ededed"
  description: "Needs maintainer/triager review"
- name: "blocked"
  color: "b60205"
  description: "Blocked on dependency, decision, or external factor"
- name: "needs-info"
  color: "fbca04"
  description: "Waiting on reporter or author for more information"
- name: "duplicate"
  color: "cfd3d7"
  description: "Same as another issue or PR"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"

# --- Community / meta ---
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (e.g. Dependabot)"
